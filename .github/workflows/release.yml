name: Release Windows x64 & macOS Universal

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows Setup EXE & Portable ZIP
        shell: cmd
        run: publish.cmd

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scream-windows-x64
          path: |
            dist/Scream-v*-Setup-x64.exe
            dist/Scream-v*-Portable-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS Universal .pkg, .dmg & .zip (Apple Silicon + Intel)
        run: |
          chmod +x host-macos/scripts/package-dmg.sh
          ./host-macos/scripts/package-dmg.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scream-macos-universal
          path: |
            dist/Scream-v*-macOS-*.pkg
            dist/Scream-v*-macOS-*.dmg
            dist/Scream-v*-macOS-*.zip

  publish-release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: false
